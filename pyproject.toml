[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarai-agent"
version = "0.2.0"
description = "Arabic-first web research and generative Q&A agent with lead workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agents*", "api*", "cli*"]
exclude = ["tests*", "web*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep default rules; ignore only patterns intentional in this codebase.
# BLE001: broad except at API boundary to avoid leaking internals
# E501: long Arabic/English diagnostic strings
# I001: historical import order; do not block CI on style alone
# F841: unused assignment kept for clarity in some tests
ignore = ["BLE001", "E501", "I001", "F841"]
