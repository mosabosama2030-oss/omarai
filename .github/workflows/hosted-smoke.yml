name: Omarai hosted acceptance smoke

on:
  workflow_dispatch:
    inputs:
      allow_provider_usage:
        description: "Approve one live agent operation under fixed server-side ceilings: up to 3 search queries, 12 provider requests, 6 model calls, 4 page fetches, and no external tool calls. Quota or charges may be consumed."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: omarai-hosted-smoke
  cancel-in-progress: false

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run no-cost hosted preflight
        if: ${{ inputs.allow_provider_usage == false }}
        shell: bash
        env:
          OMARAI_BASE_URL: ${{ secrets.OMARAI_BASE_URL }}
        run: |
          set -euo pipefail
          python scripts/hosted_smoke_test.py \
            --base-url "$OMARAI_BASE_URL" \
            --timeout 180 \
            --preflight-only \
            --output artifacts/hosted-smoke-report.json

      - name: Run live hosted acceptance
        if: ${{ inputs.allow_provider_usage == true }}
        shell: bash
        env:
          OMARAI_BASE_URL: ${{ secrets.OMARAI_BASE_URL }}
          # The bearer token is available only to the explicitly approved live step.
          OMARAI_ACCESS_TOKEN: ${{ secrets.OMARAI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/hosted_smoke_test.py \
            --base-url "$OMARAI_BASE_URL" \
            --expected-sha "$(git rev-parse HEAD)" \
            --timeout 180 \
            --allow-provider-usage \
            --output artifacts/hosted-smoke-report.json

      - name: Upload hosted question-and-answer transcript
        if: always() && hashFiles('artifacts/hosted-smoke-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarai-hosted-acceptance-transcript
          path: artifacts/hosted-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
