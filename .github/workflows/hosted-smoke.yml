name: Omarai hosted acceptance smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # daily at 08:17 Cairo time

permissions:
  contents: read

concurrency:
  group: omarai-hosted-smoke
  cancel-in-progress: false

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMARAI_BASE_URL: ${{ secrets.OMARAI_BASE_URL }}
      OMARAI_ACCESS_TOKEN: ${{ secrets.OMARAI_ACCESS_TOKEN }}
    steps:
      - name: Verify hosted target and access-token secrets are available
        shell: bash
        run: |
          if [[ -z "${OMARAI_ACCESS_TOKEN}" || ${#OMARAI_ACCESS_TOKEN} -lt 32 ]]; then
            echo "::error::GitHub Actions secret OMARAI_ACCESS_TOKEN is missing or too short."
            exit 1
          fi
          if [[ -z "${OMARAI_BASE_URL}" ]]; then
            echo "::error::GitHub Actions secret OMARAI_BASE_URL is missing."
            exit 1
          fi
          if [[ "${OMARAI_BASE_URL}" != https://* || "${OMARAI_BASE_URL}" == *\?* || "${OMARAI_BASE_URL}" == *\#* ]]; then
            echo "::error::OMARAI_BASE_URL must be an HTTPS origin without a path, query, or fragment."
            exit 1
          fi
          echo "Hosted target and access-token secrets are present; values not printed."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run live hosted acceptance test
        run: python scripts/hosted_smoke_test.py --base-url "$OMARAI_BASE_URL" --expected-sha "$(git rev-parse HEAD)" --timeout 180 --output artifacts/hosted-smoke-report.json

      - name: Upload hosted question-and-answer transcript
        if: always() && hashFiles('artifacts/hosted-smoke-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarai-hosted-acceptance-transcript
          path: artifacts/hosted-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
